name: Mobile

on:
  pull_request:
    paths:
      - "apps/mobile/**"
      - "src/app/api/v1/mobile/**"
      - "src/app/api/v1/desktop/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [master, main]
    paths:
      - "apps/mobile/**"
      - "src/app/api/v1/mobile/**"
      - "src/app/api/v1/desktop/**"
      - ".github/workflows/mobile.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Unit tests and debug APK
        working-directory: apps/mobile
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: dinaya-mobile-debug
          path: apps/mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
